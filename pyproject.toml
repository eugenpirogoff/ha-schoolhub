[project]
name = "ha-schoolhub"
version = "0.1.0"
description = "Home Assistant integration for the SWOP school portal and Drei Köche school lunch"
requires-python = ">=3.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=custom_components.schoolhub --cov-report=term-missing:skip-covered"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "SIM", "UP", "W"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components", "homeassistant", "tests"]
force-sort-within-sections = true
combine-as-imports = true
