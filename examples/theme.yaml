# Optional theme for examples/child_view.yaml: larger section titles and
# larger day/week buttons (easier to read and tap for kids). It only sets
# sizes, so colors and dark mode stay as in the default theme.
#
# Install: put this file into <config>/themes/ and make sure configuration.yaml
# has
#   frontend:
#     themes: !include_dir_merge_named themes
# then run the action "frontend.reload_themes" (or restart). The dashboard
# view uses it with "theme: SchoolHub"; without the theme it still works,
# just with the default sizes.
SchoolHub:
  # Section titles (Stundenplan, Hausaufgaben, Info)
  ha-heading-card-title-font-size: 28px
  ha-heading-card-title-font-weight: 700
  ha-heading-card-title-line-height: 1.3
  # Subtitles (Tag, Klasse, Schule)
  ha-heading-card-subtitle-font-size: 20px
  ha-heading-card-subtitle-font-weight: 600
  # Buttons and badges in the titles (◀ / ▶, Mo–Fr, open homework)
  ha-heading-badge-size: 40px
  ha-heading-badge-font-size: 17px
  ha-heading-badge-icon-size: 24px
